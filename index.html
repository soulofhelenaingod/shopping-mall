<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obchodní Dům | Data-Driven Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        html { background-color: #0f172a; }
        
        /* PLYNULÉ FIXNÍ POZADÍ - 70% FILTR BEZ BLURU */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            background-image: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('interier2.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
        }

        .sphere-card {
            border-radius: 50%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: transparent;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sphere-card:hover { transform: scale(1.1) translateY(-4px); }
        
        .sphere-card img {
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            transform: scale(1.23); 
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #grid-sfer > div:nth-child(1) img { filter: none !important; opacity: 1 !important; }
        #grid-sfer > div:nth-child(9) img { transform: scale(1.28); }
        #grid-sfer > div:nth-child(12) img { transform: scale(1.35); }
        #grid-sfer > div:nth-child(15) img { transform: scale(1.25); }
        #grid-sfer > div:nth-child(18) img { transform: scale(1.28); }
        #grid-sfer > div:nth-child(19) img { transform: scale(1.28); }
        #grid-sfer > div:nth-child(26) img { transform: scale(1.28); }
        #grid-sfer > div:nth-child(27) img { transform: scale(1.05); }
        #grid-sfer > div:nth-child(28) .sphere-card { overflow: visible !important; }
    </style>
</head>
<body class="text-gray-100 min-h-screen font-sans flex flex-col justify-between m-0 p-0 relative">

    <audio id="bg-radio" src="https://stream.zeno.fm/f3wvbbqmdg8uv" preload="none"></audio>

    <!-- TLAČÍTKO HUDBY V NEONOVÉM STYLU -->
    <button id="radio-toggle" class="fixed bottom-6 right-6 p-4 w-14 h-14 border-2 border-[#CFFF04] text-[#CFFF04] hover:bg-[#CFFF04] hover:text-black rounded-full shadow-lg backdrop-blur-md transition-all z-50 flex items-center justify-center">
        <svg id="icon-speaker" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-8 h-8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.5c-.88 0-1.6-.72-1.6-1.6V9.85c0-.88.72-1.6 1.6-1.6h2.25Z" />
        </svg>
    </button>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full">
        <div id="grid-sfer" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-8 gap-3 sm:gap-6 justify-items-center">
        </div>
    </main>

    <script>
        const audioPlayer = document.getElementById('bg-radio');
        const radioBtn = document.getElementById('radio-toggle');
        
        audioPlayer.volume = 0.3;

        radioBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                radioBtn.classList.add('bg-[#CFFF04]', 'text-black');
            } else {
                audioPlayer.pause();
                radioBtn.classList.remove('bg-[#CFFF04]', 'text-black');
            }
        });

        async function fetchAndRenderGrid() {
            const gridContainer = document.getElementById('grid-sfer');
            try {
                const response = await fetch('data.json');
                const prodejny = await response.json();
                gridContainer.innerHTML = '';
                prodejny.forEach(item => {
                    const wrapper = document.createElement('div');
                    wrapper.className = "flex flex-col items-center group w-20 sm:w-28 md:w-32";
                    let innerHTML = '';
                    const imagePath = `assets/logos/${item.logo}`;
                    
                    if (item.isInternal) {
                        innerHTML = `<a href="${item.link}" class="sphere-card w-full"><img src="${imagePath}" alt="${item.type}" class="filter brightness-0 invert opacity-80 group-hover:opacity-100 transition-all pointer-events-none select-none" draggable="false"></a>`;
                    } else if (item.link) {
                        innerHTML = `<a href="${item.link}" class="sphere-card w-full"><img src="${imagePath}" alt="${item.type}" class="pointer-events-none select-none" draggable="false"></a>`;
                    } else {
                        innerHTML = `<div class="sphere-card w-full opacity-40 cursor-default"><img src="${imagePath}" alt="${item.type}" class="grayscale pointer-events-none select-none" draggable="false"></div>`;
                    }

                    innerHTML += `<span class="mt-1 text-[9px] sm:text-sm font-semibold tracking-wide text-gray-200 text-center uppercase group-hover:text-[#CFFF04] transition-colors duration-300 block w-full whitespace-normal break-words px-0.5 leading-tight" style="font-family: 'Inter', sans-serif; min-height: 2.5rem; display: flex; align-items: flex-start; justify-content: center;">${item.type}</span>`;
                    wrapper.innerHTML = innerHTML;
                    gridContainer.appendChild(wrapper);
                });
            } catch (error) { console.error(error); }
        }

        document.addEventListener('DOMContentLoaded', fetchAndRenderGrid);
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
