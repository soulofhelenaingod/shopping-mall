<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obchodní Dům iRO</title>
    
    <link rel="icon" type="image/webp" href="rubyonrailsplus.webp">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        html { background-color: #0f172a; }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            background-image: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('pozadi2.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
        }
        .sphere-card {
            border-radius: 50%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: transparent;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sphere-card:hover { transform: scale(1.1) translateY(-4px); }
        .sphere-card img {
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            transform: scale(1.23); 
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .ruby-sphere {
            border-radius: 50%;
            border: 2px solid #fbbf24; 
            background: radial-gradient(circle at 35% 25%, #fca5a5 0%, #ef4444 20%, #991b1b 60%, #450a0a 100%);
            box-shadow: 
                inset -5px -5px 15px rgba(0, 0, 0, 0.8), 
                inset 5px 5px 10px rgba(255, 255, 255, 0.4), 
                0 0 0 2px #b45309,
                0 10px 20px rgba(0, 0, 0, 0.6);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .ruby-sphere::after {
            content: '';
            position: absolute;
            top: 8%;
            left: 18%;
            width: 45%;
            height: 25%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0));
            border-radius: 50%;
            transform: rotate(-15deg);
            pointer-events: none;
        }

        .ruby-sphere:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow: 
                inset -5px -5px 15px rgba(0, 0, 0, 0.8), 
                inset 5px 5px 10px rgba(255, 255, 255, 0.5), 
                0 0 0 2px #b45309,
                0 12px 25px rgba(0, 0, 0, 0.7),
                0 0 20px rgba(251, 191, 36, 0.4); 
        }

        .ruby-sphere.playing {
            background: radial-gradient(circle at 35% 25%, #fecaca 0%, #f87171 25%, #b91c1c 65%, #7f1d1d 100%);
            box-shadow: 
                inset -5px -5px 15px rgba(0, 0, 0, 0.7), 
                inset 5px 5px 10px rgba(255, 255, 255, 0.6), 
                0 0 0 2px #b45309,
                0 0 30px rgba(239, 68, 68, 0.7), 
                0 0 15px rgba(251, 191, 36, 0.8); 
            border-color: #fde047; 
        }

        .ruby-sphere svg {
            position: relative;
            z-index: 10;
        }

        #grid-sfer > div:nth-child(1) img { filter: none !important; opacity: 1 !important; }
        #grid-sfer > div:nth-child(9) img { transform: scale(1.28); }
        #grid-sfer > div:nth-child(12) img { transform: scale(1.35); }
        #grid-sfer > div:nth-child(15) img { transform: scale(1.25); }
        #grid-sfer > div:nth-child(18) img { transform: scale(1.28); }
        #grid-sfer > div:nth-child(19) img { transform: scale(1.28); }
        #grid-sfer > div:nth-child(26) img { transform: scale(1.28); }
        #grid-sfer > div:nth-child(27) img { transform: scale(1.05); }
    </style>
</head>
<body class="text-gray-100 min-h-screen font-sans flex flex-col justify-between m-0 p-0 relative">

    <audio id="bg-radio" preload="none"></audio>

    <button id="next-track" class="fixed bottom-10 right-28 w-12 h-12 z-[100] hidden items-center justify-center rounded-full border-2 border-[#fbbf24] bg-gray-900/80 backdrop-blur text-white hover:bg-gray-800 hover:scale-110 transition-all duration-300 shadow-[0_0_10px_rgba(251,191,36,0.3)] cursor-pointer" title="Další skladba">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#fbbf24" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061A1.125 1.125 0 0 1 3 16.811V8.69ZM12.75 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061a1.125 1.125 0 0 1-1.683-.977V8.69Z" />
        </svg>
    </button>

    <button id="radio-toggle" class="ruby-sphere fixed bottom-8 right-8 w-16 h-16 z-[100] flex items-center justify-center cursor-pointer">
        <svg id="icon-muted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" class="w-8 h-8 text-white opacity-90 transition-opacity duration-300">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.5c-.88 0-1.6-.72-1.6-1.6V9.85c0-.88.72-1.6 1.6-1.6h2.25z" />
        </svg>
        <svg id="icon-playing" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-8 h-8 text-[#fbbf24] hidden transition-opacity duration-300 drop-shadow-[0_0_6px_rgba(251,191,36,1)]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.5c-.88 0-1.6-.72-1.6-1.6V9.85c0-.88.72-1.6 1.6-1.6h2.25Z" />
        </svg>
    </button>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full">
        <div id="grid-sfer" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-8 gap-3 sm:gap-6 justify-items-center">
        </div>
    </main>

    <script>
        const audioPlayer = document.getElementById('bg-radio');
        const radioBtn = document.getElementById('radio-toggle');
        const nextBtn = document.getElementById('next-track');
        const iconMuted = document.getElementById('icon-muted');
        const iconPlaying = document.getElementById('icon-playing');
        
        const playlist = Array.from({ length: 21 }, (_, i) => `music/${i + 1}.mp3`);
        let currentTrack = 0;
        audioPlayer.volume = 0.3;

        function playTrack(index) {
            audioPlayer.src = playlist[index];
            audioPlayer.play();
        }

        audioPlayer.addEventListener('ended', () => {
            currentTrack = (currentTrack + 1) % playlist.length;
            playTrack(currentTrack);
        });

        radioBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                if (!audioPlayer.src || audioPlayer.src === window.location.href) {
                    playTrack(currentTrack);
                } else {
                    audioPlayer.play();
                }
                radioBtn.classList.add('playing');
                iconMuted.classList.add('hidden');
                iconPlaying.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                nextBtn.classList.add('flex');
            } else {
                audioPlayer.pause();
                radioBtn.classList.remove('playing');
                iconPlaying.classList.add('hidden');
                iconMuted.classList.remove('hidden');
                nextBtn.classList.add('hidden');
                nextBtn.classList.remove('flex');
            }
        });

        nextBtn.addEventListener('click', () => {
            currentTrack = (currentTrack + 1) % playlist.length;
            playTrack(currentTrack);
        });

        async function fetchAndRenderGrid() {
            const gridContainer = document.getElementById('grid-sfer');
            try {
                const response = await fetch('data.json');
                const prodejny = await response.json();

                await Promise.all(prodejny.map(item => {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.src = `assets/logos/${item.logo}`;
                        img.onload = resolve;
                        img.onerror = resolve;
                    });
                }));

                gridContainer.innerHTML = '';
                prodejny.forEach(item => {
                    const wrapper = document.createElement('div');
                    wrapper.className = "flex flex-col items-center group w-20 sm:w-28 md:w-32";
                    let innerHTML = '';
                    const imagePath = `assets/logos/${item.logo}`;
                    
                    const isSWR = item.logo.toLowerCase().includes('swr') || item.type.toLowerCase().includes('rohlenka');
                    const cardStyle = isSWR ? 'style="overflow: visible !important;"' : '';
                    
                    if (item.isInternal) {
                        innerHTML = `<a href="${item.link}" class="sphere-card w-full" ${cardStyle}><img src="${imagePath}" alt="${item.type}" class="filter brightness-0 invert opacity-80 group-hover:opacity-100 transition-all pointer-events-none select-none" draggable="false"></a>`;
                    } else if (item.link) {
                        innerHTML = `<a href="${item.link}" class="sphere-card w-full" ${cardStyle}><img src="${imagePath}" alt="${item.type}" class="pointer-events-none select-none" draggable="false"></a>`;
                    } else {
                        innerHTML = `<div class="sphere-card w-full opacity-40 cursor-default" ${cardStyle}><img src="${imagePath}" alt="${item.type}" class="grayscale pointer-events-none select-none" draggable="false"></div>`;
                    }

                    innerHTML += `<span class="mt-1 text-[9px] sm:text-sm font-semibold tracking-wide text-gray-200 text-center uppercase group-hover:text-[#CFFF04] transition-colors duration-300 block w-full whitespace-normal break-words px-0.5 leading-tight" style="font-family: 'Inter', sans-serif; min-height: 2.5rem; display: flex; align-items: flex-start; justify-content: center;">${item.type}</span>`;
                    wrapper.innerHTML = innerHTML;
                    gridContainer.appendChild(wrapper);
                });
            } catch (error) { console.error(error); }
        }

        document.addEventListener('DOMContentLoaded', fetchAndRenderGrid);
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
